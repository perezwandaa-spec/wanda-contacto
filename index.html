<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lic. Pérez Wanda — Comercio Internacional</title>
    <style>
        :root {
            --bordo: #8C1D1D;
            --negro: #222222;
            --ocre-claro: #F3EDE4;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--ocre-claro);
            color: var(--negro);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card-container {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.05);
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .header h1 {
            font-size: 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 10px 0 5px 0;
            color: var(--negro);
        }
        .header p {
            font-size: 14px;
            color: #666;
            margin: 0 0 25px 0;
        }
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background-color: var(--ocre-claro);
            border-radius: 12px;
            text-decoration: none;
            color: var(--negro);
            font-weight: 500;
            transition: transform 0.2s;
        }
        .link-item:hover {
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 30px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #999;
        }
    </style>
</head>
<body>

<div class="card-container">
    <div class="header">
        <!-- Se eliminó la línea decorativa bordó para limpiar el diseño visual -->
        <h1>Lic. Pérez Wanda</h1>
        <p>International Trade & Global Sourcing Specialist</p>
    </div>

    <div class="links-list">
        <a href="https://wa.me" class="link-item">
            <span>💬 WhatsApp</span>
            <span>➔</span>
        </a>
        <div class="link-item" style="cursor:pointer;" onclick="navigator.clipboard.writeText('wperezcomex1'); alert('ID de WeChat copiado');">
            <span>📱 WeChat ID: wperezcomex1</span>
            <span style="font-size:12px; color:#777;">Copiar</span>
        </div>
        <a href="mailto:wperezcomex@gmail.com" class="link-item">
            <span>✉️ Email</span>
            <span>➔</span>
        </a>
    </div>

    <div class="footer">
        Global Sourcing • Comercio Exterior
    </div>
</div>

</body>
</html>
