<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lic. Pérez Wanda | Comercio Internacional</title>

<meta name="description" content="Lic. Pérez Wanda — International Trade & Global Sourcing Specialist">
<meta name="theme-color" content="#f3ede7">

<style>
:root {
    --burgundy: #8c1d22;
    --black: #222222;
    --gray: #625d59;
    --cream: #f3ede7;
    --border: #ddd4cc;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    background: var(--cream);
    color: var(--black);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
}

a {
    color: inherit;
    text-decoration: none;
}

button {
    font-family: inherit;
}

.page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.contact-card {
    width: 100%;
    max-width: 620px;
    margin: 0 auto;
    padding: 28px 22px 18px;
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* =========================
   MAPA MUNDIAL
   Sin flechas ni líneas.
   Los puntos ya caen sobre territorio real.
========================= */

.map-area {
    position: relative;
    width: 100%;
    height: 245px;
    margin-bottom: 8px;
    overflow: hidden;
    background: var(--cream);
}

.world-map {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.world-map img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    object-position: center;
}

/* =========================
   IDENTIDAD
========================= */

.identity {
    text-align: center;
    padding: 0 8px;
}

.profession {
    color: var(--burgundy);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .22em;
    text-transform: uppercase;
    margin-bottom: 12px;
}

h1 {
    color: var(--black);
    font-size: clamp(30px, 8vw, 42px);
    line-height: 1.08;
    font-weight: 650;
    letter-spacing: .015em;
    margin-bottom: 14px;
}

.subtitle {
    color: var(--gray);
    font-size: 15px;
    line-height: 1.55;
    letter-spacing: .025em;
}

/* Sin línea bordó debajo del subtítulo */

/* =========================
   BOTONES DE CONTACTO
========================= */

.actions {
    margin-top: 30px;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    background: rgba(248,244,239,.38);
}

.action {
    min-height: 76px;
    width: 100%;
    display: flex;
    align-items: center;
    padding: 14px 18px;
    border: none;
    border-bottom: 1px solid var(--border);
    background: transparent;
    color: var(--black);
    text-align: left;
    cursor: pointer;
    transition: background .2s ease, transform .15s ease;
}

.action:last-child {
    border-bottom: none;
}

.action:hover {
    background: rgba(255,255,255,.32);
}

.action:active {
    transform: scale(.99);
}

.icon {
    width: 42px;
    height: 42px;
    min-width: 42px;
    margin-right: 16px;
    color: var(--burgundy);
    display: flex;
    align-items: center;
    justify-content: center;
}

.icon svg {
    width: 29px;
    height: 29px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.65;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.action-content {
    min-width: 0;
    flex: 1;
}

.action-title {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.3;
}

.action-detail {
    color: var(--gray);
    font-size: 13px;
    line-height: 1.4;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.arrow {
    color: #77716d;
    font-size: 25px;
    font-weight: 300;
    margin-left: 8px;
}

/* =========================
   FOOTER
========================= */

footer {
    margin-top: auto;
    padding: 24px 10px 10px;
    text-align: center;
}

footer::before {
    content: "";
    display: block;
    width: 100%;
    height: 1px;
    background: var(--border);
    margin-bottom: 18px;
}

footer p {
    color: #77716d;
    font-size: 10px;
    letter-spacing: .24em;
    text-transform: uppercase;
}

/* =========================
   CELULARES CHICOS
========================= */

@media (max-width: 380px) {
    .contact-card {
        padding-left: 16px;
        padding-right: 16px;
    }

    .map-area {
        height: 225px;
    }

    .profession {
        font-size: 11px;
        letter-spacing: .18em;
    }

    h1 {
        font-size: 29px;
    }

    .subtitle {
        font-size: 14px;
    }

    .action {
        min-height: 70px;
        padding-left: 14px;
        padding-right: 14px;
    }

    .icon {
        margin-right: 11px;
    }

    .action-title {
        font-size: 16px;
    }
}

/* =========================
   DESKTOP
========================= */

@media (min-width: 700px) {
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
        background: #ece8e3;
    }

    .page {
        width: 100%;
        max-width: 620px;
        min-height: calc(100vh - 60px);
        background: var(--cream);
        box-shadow: 0 10px 35px rgba(40,30,25,.10);
    }

    .contact-card {
        padding-left: 42px;
        padding-right: 42px;
    }
}
</style>
</head>
