<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lic. Pérez Wanda | Comercio Internacional</title>

    <meta name="description"
          content="Lic. Pérez Wanda — International Trade & Global Sourcing Specialist">

    <meta name="theme-color" content="#f3ede7">

    <style>
        :root {
            --burgundy: #8c1d22;
            --burgundy-dark: #78171c;
            --black: #222222;
            --gray: #625d59;
            --cream: #f3ede7;
            --cream-light: #f8f4ef;
            --border: #ddd4cc;
            --map: #d5cbc2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: var(--cream);
            color: var(--black);
            font-family:
                "Helvetica Neue",
                Helvetica,
                Arial,
                sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font-family: inherit;
        }


        /* =========================================
           PAGE
        ========================================= */

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }


        /* =========================================
           MAIN CARD
        ========================================= */

        .contact-card {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
            padding: 34px 22px 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }


        /* =========================================
           WORLD MAP
        ========================================= */

        .map-area {
            position: relative;
            width: 100%;
            height: 230px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .map {
            position: absolute;
            width: 112%;
            left: -6%;
            top: 0;
            height: 100%;
        }

        .map svg {
            width: 100%;
            height: 100%;
        }

        .map-dot {
            fill: var(--map);
        }

        .connection {
            fill: none;
            stroke: var(--burgundy);
            stroke-width: 1.6;
        }

        .connection-point {
            fill: var(--burgundy);
        }


        /* =========================================
           IDENTITY
        ========================================= */

        .identity {
            text-align: center;
            padding: 0 10px;
        }

        .profession {
            color: var(--burgundy);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.23em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        h1 {
            color: var(--black);
            font-size: clamp(30px, 8vw, 43px);
            line-height: 1.08;
            font-weight: 700;
            letter-spacing: 0.025em;
            margin-bottom: 15px;
        }

        .subtitle {
            color: var(--gray);
            font-size: 15px;
            line-height: 1.55;
            letter-spacing: 0.03em;
        }

        /*
         * No hay línea bordó debajo del subtítulo.
         */


        /* =========================================
           CONTACT BUTTONS
        ========================================= */

        .actions {
            margin-top: 30px;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            background: rgba(248, 244, 239, 0.38);
        }

        .action {
            min-height: 76px;
            width: 100%;
            display: flex;
            align-items: center;
            padding: 14px 18px;
            border: none;
            border-bottom: 1px solid var(--border);
            background: transparent;
            color: var(--black);
            text-align: left;
            cursor: pointer;
            transition:
                background 0.2s ease,
                transform 0.15s ease;
        }

        .action:last-child {
            border-bottom: none;
        }

        .action:hover {
            background: rgba(255, 255, 255, 0.32);
        }

        .action:active {
            transform: scale(0.99);
        }

        .icon {
            width: 42px;
            height: 42px;
            min-width: 42px;
            margin-right: 16px;
            color: var(--burgundy);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon svg {
            width: 29px;
            height: 29px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.65;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .action-content {
            min-width: 0;
            flex: 1;
        }

        .action-title {
            font-size: 17px;
            font-weight: 600;
            line-height: 1.3;
            margin-right: 6px;
        }

        .action-detail {
            color: var(--gray);
            font-size: 13px;
            line-height: 1.4;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .arrow {
            color: #77716d;
            font-size: 25px;
            font-weight: 300;
            margin-left: 8px;
        }


        /* =========================================
           FOOTER
        ========================================= */

        footer {
            margin-top: auto;
            padding: 24px 10px 10px;
            text-align: center;
        }

        footer::before {
            content: "";
            display: block;
            width: 100%;
            height: 1px;
            background: var(--border);
            margin-bottom: 18px;
        }

        footer p {
            color: #77716d;
            font-size: 10px;
            letter-spacing: 0.24em;
            text-transform: uppercase;
        }


        /* =========================================
           SMALL PHONES
        ========================================= */

        @media (max-width: 380px) {

            .contact-card {
                padding-left: 16px;
                padding-right: 16px;
            }

            .map-area {
                height: 205px;
            }

            .profession {
                font-size: 11px;
                letter-spacing: 0.18em;
            }

            h1 {
                font-size: 29px;
            }

            .subtitle {
                font-size: 14px;
            }

            .action {
                min-height: 70px;
                padding-left: 14px;
                padding-right: 14px;
            }

            .icon {
                margin-right: 11px;
            }

            .action-title {
                font-size: 16px;
            }
        }


        /* =========================================
           DESKTOP
        ========================================= */

        @media (min-width: 700px) {

            body {
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 30px;
                background: #ece8e3;
            }

            .page {
                width: 100%;
                max-width: 620px;
                min-height: calc(100vh - 60px);
                background: var(--cream);
                box-shadow:
                    0 10px 35px rgba(40, 30, 25, 0.10);
            }

            .contact-card {
                padding-left: 42px;
                padding-right: 42px;
            }
        }
    </style>
</head>

<script>

    function saveContact() {

        const vcard =
`BEGIN:VCARD
VERSION:3.0
N:Pérez;Wanda;;Lic.;
FN:Lic. Pérez Wanda
TITLE:International Trade & Global Sourcing Specialist
TEL;TYPE=CELL:+541149289218
EMAIL;TYPE=INTERNET:wperezcomex@gmail.com
NOTE:WeChat: wperezcomex1
END:VCARD`;

        const blob = new Blob(
            [vcard],
            { type: "text/vcard;charset=utf-8" }
        );

        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");

        link.href = url;
        link.download = "Wanda_Perez.vcf";

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

        URL.revokeObjectURL(url);
    }

</script>
